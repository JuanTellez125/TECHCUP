services:

  db:
    image: postgres:16-alpine
    container_name: techcup-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TECHCUP_DB_NAME:-techcup}
      POSTGRES_USER: ${TECHCUP_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${TECHCUP_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - techcup-db-data:/var/lib/postgresql/data
    networks:
      - techcup-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TECHCUP_DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techcup-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TECHCUP_DATASOURCE_URL: jdbc:postgresql://db:5432/${TECHCUP_DB_NAME:-techcup}
      TECHCUP_DATASOURCE_USERNAME: ${TECHCUP_DATASOURCE_USERNAME:-postgres}
      TECHCUP_DATASOURCE_PASSWORD: ${TECHCUP_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
    ports:
      - "8080:8080"
    networks:
      - techcup-network

volumes:
  techcup-db-data:
    name: techcup-db-data

networks:
  techcup-network:
    name: techcup-network