name: Build and deploy JAR app to Azure Web App - TechCup-TestigosJehova

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'microsoft'
  APP_NAME: 'TechCup-TestigosJehova'

jobs:

  # ─────────────────────────────────────────────
  # 1. BUILD
  # ─────────────────────────────────────────────
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven (skip tests)
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://metro.proxy.rlwy.net:36178/railway
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: 3600000
        run: mvn clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/target/*.jar'
          retention-days: 5

  # ─────────────────────────────────────────────
  # 2. TEST
  # ─────────────────────────────────────────────
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests with JaCoCo coverage
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://metro.proxy.rlwy.net:36178/railway
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: 3600000
        run: mvn test jacoco:report

      - name: Upload Surefire test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 5

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 5

  # ─────────────────────────────────────────────
  # 3. ANALYSIS (JaCoCo coverage gate)
  # ─────────────────────────────────────────────
  analysis:
    name: 📊 Coverage Analysis
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      pull-requests: write  # Para comentar cobertura en PRs

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run JaCoCo coverage report
      - env:
      - SPRING_DATASOURCE_URL: jdbc:postgresql://metro.proxy.rlwy.net:36178/railway
      - SPRING_DATASOURCE_USERNAME: postgres
      - SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
      - JWT_SECRET: ${{ secrets.JWT_SECRET }}
      - JWT_EXPIRATION: 3600000
      - run: mvn test jacoco:report

      # Publica el resumen de cobertura directo en el workflow summary de GitHub
      - name: Publish JaCoCo coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-full-report
          path: target/site/jacoco/
          retention-days: 10

      - name: Add coverage summary to GitHub Step Summary
        run: |
          echo "## 📊 JaCoCo Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Extrae el porcentaje de cobertura del XML de JaCoCo
          MISSED=$(grep -oP 'missed="\K[0-9]+' target/site/jacoco/jacoco.xml | paste -sd+ | bc)
          COVERED=$(grep -oP 'covered="\K[0-9]+' target/site/jacoco/jacoco.xml | paste -sd+ | bc)
          TOTAL=$((MISSED + COVERED))
          if [ "$TOTAL" -gt 0 ]; then
            PCT=$(echo "scale=1; $COVERED * 100 / $TOTAL" | bc)
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Lines Covered | $COVERED |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Lines Missed  | $MISSED |" >> $GITHUB_STEP_SUMMARY
            echo "| 📈 Coverage      | **$PCT%** |" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No se pudo calcular la cobertura." >> $GITHUB_STEP_SUMMARY
          fi

  # ─────────────────────────────────────────────
  # 4. SECURITY
  # ─────────────────────────────────────────────
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DassemblyAnalyzerEnabled=false
        continue-on-error: true

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: target/dependency-check-report.html
          retention-days: 5

  # ─────────────────────────────────────────────
  # 5. DEPLOY QA (validación local del JAR)
  # ─────────────────────────────────────────────
  deploy-qa:
    name: 🧪 QA Validation
    runs-on: ubuntu-latest
    needs: [analysis, security]
    permissions:
      contents: read

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Validate JAR starts correctly
        run: |
          JAR_FILE=$(ls *.jar | head -n 1)
          echo "Validando JAR: $JAR_FILE"
          java -jar $JAR_FILE \
            --spring.profiles.active=test \
            --spring.datasource.url=jdbc:postgresql://metro.proxy.rlwy.net:36178/railway \
            --spring.datasource.username=postgres \
            --spring.datasource.password=${{ secrets.SPRING_DATASOURCE_PASSWORD }} \
            --jwt.secret=${{ secrets.JWT_SECRET }} &
          APP_PID=$!
          sleep 20
          curl --fail http://localhost:8080/actuator/health \
            && echo "✅ QA Validation passed" \
            || echo "⚠️ Actuator no disponible, revisá si spring-boot-actuator está en el pom.xml"
          kill $APP_PID || true

  # ─────────────────────────────────────────────
  # 6. DEPLOY PRODUCTION
  #    Autenticación OIDC original de Azure intacta
  # ─────────────────────────────────────────────
  deploy-production:
    name: 🏁 Deploy Production
    runs-on: ubuntu-latest
    needs: deploy-qa
    permissions:
      id-token: write   # Requerido por Azure OIDC — NO modificar
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1304AAD1D40848D38F7F1B0B9457868A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C220CCC3FF7D440195E7699EC059C50E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8C73A8F288FE4429883C8289442138CD }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: 'Production'
          package: '*.jar'